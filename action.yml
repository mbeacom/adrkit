# @adr 0036
name: adrkit governing-decisions
description: Comment the architecture decisions governing a pull request and validate changed ADR records.
author: adrkit
branding:
  icon: git-pull-request
  color: purple

inputs:
  dir:
    description: ADR corpus directory (repo-relative).
    required: false
    default: docs/adr
  token:
    description: >-
      Token used to read the PR's changed files and post the comment. The
      default GITHUB_TOKEN is sufficient; pull-requests write permission is
      needed to comment (the Action degrades to a log notice without it).
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: packages/ci/dist/index.js

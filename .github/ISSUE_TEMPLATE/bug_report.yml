name: Bug report
description: Report something that behaves incorrectly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please **do not** report security
        vulnerabilities here — see [SECURITY.md](https://github.com/mbeacom/adrkit/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: 'adr lint reported ... but I expected ...'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands and, if relevant, a minimal corpus or record.
      placeholder: |
        1. adr new "..."
        2. adr lint
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: adrkit version
      description: Output of `adr --version` (or the package version you installed).
      placeholder: '0.7.0'
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which surface?
      options:
        - '@adrkit/cli'
        - '@adrkit/core'
        - '@adrkit/evaluator'
        - '@adrkit/mcp'
        - '@adrkit/spec-kit (Spec Kit extension)'
        - 'CI Action (packages/ci)'
        - 'Docs / website'
        - 'Not sure'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, and Node or Bun version.
      placeholder: 'macOS 15, Node 22.11'
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any error output. This is rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false

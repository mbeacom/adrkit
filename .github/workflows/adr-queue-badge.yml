name: ADR queue badge

# Regenerates .adrkit/queue.json so the README's ARB queue badge reads a current
# number (ADR-0022). shields.io renders `$.totalItems` from the committed file;
# adrkit ships no badge endpoint and nothing is computed on adrkit.dev.
#
# Runs on corpus change only, never on a schedule. Queue *depth* is independent
# of `asOf` — buildQueueReport selects items by `status === 'proposed'` and uses
# `asOf` only for per-item SLA state — so a scheduled rebuild would produce a
# daily commit that changes nothing a badge reads. See ADR-0022 §3.
#
# Deliberately not triggered by `.adrkit/**`: this workflow's own commit must not
# re-trigger it.

on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - '.github/workflows/adr-queue-badge.yml'
  workflow_dispatch:

permissions:
  contents: read

# One regeneration at a time per ref; a superseded run has nothing worth keeping.
concurrency:
  group: adr-queue-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # This job pushes, so it needs the token. Every other workflow in this
          # repository sets `false`; the exception is deliberate and scoped here.
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generated from this repository's own source rather than the published
      # CLI, so the artifact always matches the corpus in the same commit.
      # Adopters should use `npx @adrkit/cli` instead — see the badges guide.
      - name: Generate queue report
        run: |
          mkdir -p .adrkit
          bun run packages/cli/src/index.ts queue --format json > .adrkit/queue.json.tmp

      # A truncated or malformed write renders as `no result` on the badge, which
      # looks like a tooling bug to every reader of the README. Fail here instead.
      - name: Validate the generated report
        run: |
          python3 - <<'PY'
          import json, sys
          with open('.adrkit/queue.json.tmp', encoding='utf-8') as fh:
              report = json.load(fh)
          if report.get('version') != '1':
              sys.exit(f"unexpected QueueReport version: {report.get('version')!r}")
          if not isinstance(report.get('totalItems'), int):
              sys.exit("totalItems missing or not an integer; the badge would render 'no result'")
          print(f"QueueReport v1 OK — totalItems={report['totalItems']}")
          PY
          mv .adrkit/queue.json.tmp .adrkit/queue.json

      - name: Commit when the report changed
        run: |
          if git diff --quiet -- .adrkit/queue.json; then
            echo "Queue report unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .adrkit/queue.json
          # [skip ci] because ci.yml has no paths filter on push to main and this
          # commit changes no source.
          git commit -m 'chore(adr): refresh ARB queue report for the badge [skip ci]'
          git push

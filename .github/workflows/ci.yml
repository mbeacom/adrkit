name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-clone-builds:
    # T093 / FR-050 — a clean clone builds, typechecks, lints and tests green with both
    # feature-010 packages present, and **network access is permitted only during
    # `bun install --frozen-lockfile`**.
    #
    # The second half is enforced, not merely intended. Every step after the install runs
    # through `scripts/run-network-denied.ts`, which proves a qualifying denial mechanism
    # actually denies *in this environment* before it runs anything, and fails closed if
    # none can be proved. See `specs/009-catalog-binding-viability/contracts/
    # scale-and-security-measurement.md` §5, cited at its original location.
    #
    # A bare `unshare --net` prefix was rejected: if it silently stopped denying, this job
    # would keep passing and the guarantee would be gone with nothing to notice.
    #
    # Pinned to a concrete image, unlike every other job in this file, because this one's
    # viability depends on three properties of the image itself rather than on anything in
    # this repository:
    #
    #   * AppArmor's unprivileged-user-namespace restriction, which is why candidate 1
    #     (`unshare --net --map-root-user`) is refused here and the sudo candidate is the
    #     one selected;
    #   * passwordless `sudo -n` with a `secure_path` that excludes `~/.bun/bin`;
    #   * `unshare` and `setpriv` from util-linux.
    #
    # The 22.04 → 24.04 migration is what introduced the first of those. Because the gate
    # is fail-closed by design, the next such migration would turn this job red on every
    # PR and push at once, and the fix would live in this file — needing a `workflow`-scoped
    # token while branch protection built on this job blocks everything else. Pinning makes
    # that bump a reviewed change rather than an ambient one.
    #
    # Verified green on `ubuntu-24.04` image 20260810.271.1, run 31761606849. If this job
    # ever goes red here, read the wrapper's own failure output rather than a runbook: it
    # branches on the three classes that need telling apart — the loopback control never
    # connected (a fault in the script or a proxy), the mechanisms ran and the payload
    # failed (a fault in ours), or no mechanism is available (a fault in the image) — and
    # names what to look at in each. Whatever the cause, do not remove the wrapper: it is
    # fail-closed by design, and a red build is the intended behaviour.
    #
    # The other jobs here stay on `ubuntu-latest` deliberately: none of them depends on
    # image internals, so pinning them would add bumps to review without covering a risk.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      # The ONLY step permitted to use the network.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Asserted before anything is built: a green build that silently skipped both new
      # packages would look identical to one that included them.
      #
      # Wrapped like every other post-install step. It is a Bun script and would otherwise
      # have had ambient network access purely because it happens to run early — and the
      # evidence README claims every subsequent step is routed through the wrapper, which
      # this step was quietly falsifying.
      - name: Verify both feature-010 packages are present in this clone (network denied)
        run: bun scripts/run-network-denied.ts -- bun scripts/check-clean-clone.ts
      - name: Typecheck (network denied)
        run: bun scripts/run-network-denied.ts -- bun run typecheck
      - name: Build (network denied)
        run: bun scripts/run-network-denied.ts -- bun run build
      - name: Verify publishable package tarballs (network denied)
        run: bun scripts/run-network-denied.ts -- bun run release:pack -- --skip-build --skip-smoke-install
      - name: Lint (network denied)
        run: bun scripts/run-network-denied.ts -- bun run lint
      # The ONE unwrapped post-install step: 14 of the 15 run under a proved denial, and
      # this is the 15th. It cannot be wrapped, because the suite contains the two-sided
      # controls that establish the denial and a control cannot prove one from inside it —
      # observed on both platforms, failing differently (3 tests on macOS, where
      # `sandbox-exec` denies loopback outright; 11 on Linux, where `lo` comes up and the
      # denial-proving tests instead fail to nest a sandbox inside the one wrapping them).
      #
      # Ambient availability, never use: a test that reaches the network is an FR-050
      # defect regardless. Reasoning and both captures:
      # `<EVIDENCE>/negative-cases/clean-clone-offline/` case 3 and case 3b.
      - name: Test (the one post-install step not network-denied)
        run: bun test
      # Both halves wrapped. The `&& git diff` used to run outside the wrapper under a step
      # whose name said "(network denied)", which made the disclosed exemption list wrong
      # by one and was found by review rather than by the ledger.
      - name: Verify schema emit matches (network denied)
        run: bun scripts/run-network-denied.ts -- sh -c 'bun run schema:emit && git diff --exit-code schema/adr.schema.json'
      - name: Verify committed Action bundle matches source (network denied)
        run: bun scripts/run-network-denied.ts -- git diff --exit-code packages/ci/dist
      # MANIFEST.md's record inventory is a pure function of docs/adr/, and it drifted
      # six records before anyone noticed (#131). A guard that merely reported the
      # divergence would still leave a human to hand-edit the table — which is how it
      # drifted — so the block is regenerated and the tree asserted unchanged, exactly
      # like the schema emit above. Both halves wrapped, for the reason recorded there.
      - name: Verify MANIFEST inventory matches the corpus (network denied)
        run: bun scripts/run-network-denied.ts -- sh -c 'bun run emit:manifest && git diff --exit-code MANIFEST.md'
      - name: Verify dependency boundaries (adapters + toolkit confinement)
        run: bun scripts/run-network-denied.ts -- bun run check:deps
      - name: Verify frozen oracle hashes match (feature 010 Barrier B, R5 mechanism 2)
        run: bun scripts/run-network-denied.ts -- bun run check:freeze-hashes
      - name: Verify published docs pin the current CLI release (network denied)
        run: bun scripts/run-network-denied.ts -- bun run check:doc-pins
      - name: Verify the ADR-0020 clause-8 gate (clause 5 evidence is present and PASSing)
        run: bun scripts/run-network-denied.ts -- bun run check:clause8
      - name: Verify no spike-009 B/C/D comparison heuristic is present (FR-061)
        run: bun scripts/run-network-denied.ts -- bun run check:no-spike-heuristics
      # site/ cannot import the loader (ADR-0011), so gen-adr-pages.ts restates
      # core's corpus grammar. This asserts the copy still matches, and that its
      # one intentional divergence is still intentional. Pure local file
      # comparison, so it runs under the same proved denial as its neighbours.
      - name: Verify the site's corpus grammar matches core (network denied)
        run: bun scripts/run-network-denied.ts -- bun run check:site-grammar
      - name: Lint ADR corpus (network denied)
        run: bun scripts/run-network-denied.ts -- bun run adr lint

  node-smoke-built-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Pack and install publishable packages
        run: bun run release:pack -- --skip-build
      - name: Smoke test built Node artifacts (core, evaluator, MCP on both protocol eras, CLI incl. offline adr evaluate + adr queue, Action bundle)
        run: node scripts/smoke-node.mjs
      - name: Smoke test committed queue Action bundle (corpus-load boundary, no network)
        run: node scripts/smoke-queue-node.mjs
      - name: Smoke test installed npm tarballs
        run: node .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the all-in-one image
        run: docker build -f Containerfile --target adrkit -t adrkit:ci .
      - name: Build the dedicated CLI target
        run: docker build -f Containerfile --target cli -t adrkit-cli:ci .
      - name: Build the dedicated MCP target
        run: docker build -f Containerfile --target mcp -t adrkit-mcp:ci .
      - name: Build the dedicated governing-decisions Action target
        run: docker build -f Containerfile --target ci -t adrkit-action:ci .
      - name: Build the dedicated queue Action target
        run: docker build -f Containerfile --target queue-action -t adrkit-queue-action:ci .
      - name: Assert dedicated target isolation
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh adrkit-cli:ci -c \
            'test -f /opt/adrkit/adr.js && test ! -e /opt/adrkit/adrkit-mcp.js && test ! -e /opt/adrkit/ci.js'
          docker run --rm --entrypoint sh adrkit-mcp:ci -c \
            'test -f /opt/adrkit/adrkit-mcp.js && test ! -e /opt/adrkit/adr.js && test ! -e /opt/adrkit/ci.js'
          docker run --rm --entrypoint sh adrkit-action:ci -c \
            'test -f /opt/adrkit/ci.js && test ! -e /opt/adrkit/adr.js && test ! -e /opt/adrkit/queue-action.js'
          docker run --rm --entrypoint sh adrkit-queue-action:ci -c \
            'test -f /opt/adrkit/queue-action.js && test ! -e /opt/adrkit/adr.js && test ! -e /opt/adrkit/ci.js'
      - name: Smoke test CLI and both MCP protocol eras without runtime network access
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' adrkit:ci)" = node
          test "$(docker run --rm --read-only --network none adrkit-cli:ci --version)" = "$(jq -r .version package.json)"
          test "$(docker run --rm --read-only --network none adrkit:ci cli --version)" = "$(jq -r .version package.json)"
          docker run --rm --read-only --network none adrkit:ci --help | grep -F 'selectors:'
          docker run --rm --read-only --network none \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            adrkit-cli:ci lint --dir docs/adr
          docker run --rm --read-only --network none \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            adrkit:ci lint --dir docs/adr
          node scripts/smoke-container.mjs adrkit-mcp:ci
          node scripts/smoke-container.mjs adrkit:ci mcp
      - name: Exercise the governing-decisions Action event boundary
        run: |
          set -euo pipefail
          event="$RUNNER_TEMP/container-pr-event.json"
          jq -n '{
            number: 1,
            repository: {name: "adrkit", full_name: "mbeacom/adrkit"},
            pull_request: {
              number: 1,
              base: {sha: "0000000000000000000000000000000000000000"},
              head: {sha: "1111111111111111111111111111111111111111"}
            }
          }' > "$event"
          set +e
          output=$(docker run --rm --network none \
            -e GITHUB_EVENT_NAME=pull_request \
            -e GITHUB_EVENT_PATH=/tmp/event.json \
            -e GITHUB_REPOSITORY=mbeacom/adrkit \
            -e GITHUB_WORKSPACE=/workspace \
            -e INPUT_DIR=docs/adr \
            -e INPUT_TOKEN=container-smoke-token \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$event:/tmp/event.json:ro" \
            adrkit:ci ci 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          if grep -F 'not a pull_request event' <<<"$output"; then
            echo "The containerized Action ignored the supplied pull_request event." >&2
            exit 1
          fi
      - name: Exercise the queue Action corpus boundary
        run: |
          set -euo pipefail
          set +e
          output=$(docker run --rm --network none \
            -e GITHUB_REPOSITORY=mbeacom/adrkit \
            -e GITHUB_WORKSPACE=/workspace \
            -e INPUT_DIR=missing \
            -e INPUT_TOKEN=container-smoke-token \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            adrkit:ci queue-action 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "could not load the ADR corpus at 'missing'" <<<"$output"

  audit:
    # Fail the build on high/critical advisories in this checkout's resolved
    # workspace dependency tree as installed by `bun install --frozen-lockfile`.
    # This does not audit consumer installs of published @adrkit/* manifests,
    # which resolve from the published manifests and inherit no root overrides or
    # workspace pins; the gate output records any known published-consumer
    # exposure separately (there is none as of ADR-0018).
    # Kept a separate job because it needs network for the advisory database, so
    # it never entangles the no-network clean-clone guarantee (ADR-0007).
    # ADR-0016: observed failing on the pre-fix tree; the permanent negative case
    # lives at scripts/__fixtures__/audit/prefix-high.json with unit coverage in
    # scripts/audit-gate.test.ts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies (fail on high/critical advisories)
        run: bun run audit:gate

  self-dogfood:
    # Run the CI surface against the project that ships it: adr check on the PR's
    # changed files. Governs the corpus that defines the tool (rung-3 dogfood).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: adr check on the PR's changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # Include deletions: a decision may govern a removed path, so deleted files
          # must stay in the changed set for path matchers to fire.
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          printf '  %s\n' "${changed[@]}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files to check."
            exit 0
          fi
          bun run adr check "${changed[@]}"

  action-dogfood:
    # Run the *Action* against this repository's own pull requests, twice, and assert
    # the pull request ends up carrying exactly one governing-decisions comment
    # (ADR-0026 action item 9, issue #135).
    #
    # `self-dogfood` above exercises the CLI — the corpus loader, `affects` resolution,
    # and exit codes — with `contents: read`. It never constructs a GitHub client,
    # never resolves an identity, and never posts. That is why issue #107 survived two
    # releases posting a duplicate comment per push: every suite was green, and the job
    # log it printed is what healthy operation prints. Only the pull request's own
    # comment list distinguishes the two, so this job reads it.
    #
    # `needs: clean-clone-builds` is load-bearing, not ordering hygiene. `uses:` runs
    # the *committed* `packages/ci/dist` — what adopters get — so without the bundle
    # drift gate ahead of it this job could pass over a stale bundle while the source
    # it claims to cover is broken.
    #
    # Two exclusions, both of which would otherwise produce a red run on a healthy
    # Action, because the token is read-only and the Action correctly degrades to a
    # log notice (FR-014) leaving no comment for the assertion to find:
    #   - a fork pull request, whose GITHUB_TOKEN is read-only whatever `permissions`
    #     says. This is a documented blind spot (ADR-0026 item 9), not a solved case;
    #     `pull_request_target` would close it by running base-repo workflows with a
    #     write token against fork-authored code, which is not a trade this repository
    #     will make for a CI signal.
    #   - Dependabot, whose runs also receive a read-only token by design.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: clean-clone-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only job in this repository that can write. Scoped to one job rather than
      # raised at the workflow level so the write capability is visible in one place.
      pull-requests: write
    # `cancel-in-progress: false`, matching `release.yml` and the reference workflow in
    # `specs/004-ci-surface/evidence/reference-repo/`. This job was the odd one out at
    # `true` until the second operator review noticed that the reference file argues the
    # opposite case in writing — for the same write, to the same comment — and that I had
    # written both. Cancellation is a signal plus a grace period, not a guarantee the run
    # has stopped, so a cancelled dispatch can still be inside its create call when the
    # replacement lists an empty set and creates its own. The result is a duplicate, which
    # is deliberately non-retryable and needs a human to delete a comment: a cancelled
    # write leaves worse state than a queued one. The cost is that a burst of pushes
    # queues this job rather than superseding it.
    concurrency:
      group: action-dogfood-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # Without this the job inherits the 360-minute default. A hung `gh api` would leave a
    # required check Pending for six hours — the one state that produces no notification
    # and no log line, so the pull request is unmergeable and nothing says why.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      # No `bun install`. The Action is a self-contained bundle and the assertion
      # script imports only builtins, so a broken dependency graph cannot take this
      # gate down with it — the same property `dco` below is built for.
      # Record which comments are already ours BEFORE anything dispatches. The Action
      # never deletes, so a duplicate outlives whatever created it; without this the
      # gate can only say "the regression of #107" on a pull request whose Action is
      # healthy and whose surplus comment predates the run.
      - name: Snapshot the governing-decisions comments that already exist
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One id per line, joined afterwards. `--paginate` applies `--jq` per page and
          # concatenates the results, so a `join(",")` INSIDE the filter emits one
          # comma-joined line PER PAGE — and a pull request past one page of comments
          # would then hand `--expect-ids` a multi-line value that parses as NaN. Not
          # hypothetical: measured against the labels endpoint at `per_page=5`, the
          # in-filter form produced three lines and this form produced one.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select((.body // "") | test("^<!-- adrkit:ci -->(\r|\n|$)"))
                      | select(.user.type == "Bot") | .id' \
            | paste -sd, - > "$RUNNER_TEMP/prior-ids"
          echo "already ours before this run: $(cat "$RUNNER_TEMP/prior-ids" || echo none)"
      - name: Run the governing-decisions Action (first dispatch)
        uses: ./packages/ci
        with:
          dir: docs/adr
      - name: Assert the first dispatch left exactly one comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # This is also a read-your-writes barrier, which is why it runs between the
          # two dispatches rather than only after them. GitHub can serve the comment
          # list from a replica, and a second dispatch that listed before the first
          # comment became visible would create a duplicate and fail a *healthy*
          # Action. Retrying turns that race into a bounded, named failure instead of a
          # false positive.
          #
          # Only exit 2 is retried. That is the checker's "read again" code, raised when
          # every violation is a consistency artefact; exit 1 is a verdict about the
          # comment set that reading again cannot change, and retrying it would just be
          # retrying until a gate passes.
          verdict=""
          # Five attempts with exponential backoff (5s, 10s, 20s, 40s — 75s total). A
          # flat 25s was sized for read-replica lag, which is sub-second; the transient
          # classes actually met are longer — a secondary rate limit is answered with a
          # Retry-After commonly at or above 60s.
          for attempt in 1 2 3 4 5; do
            # Each API read is soft. Under `bash -e` a bare `gh api` failure would kill
            # the step on attempt 1, so the loop could not retry the transient class it
            # exists for. A 502 or a secondary rate limit now costs an attempt, not the
            # run.
            #
            # The list read is bracketed by two count reads and the SMALLER is passed,
            # because the count and the list cannot be read atomically. A comment
            # created mid-read makes the list longer than the earlier count; one
            # deleted mid-read makes it shorter. Only a genuinely truncated list is
            # short of both.
            if ! before=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" --jq '.comments') \
               || ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                    > "$RUNNER_TEMP/after-first.json" \
               || ! after=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" --jq '.comments'); then
              verdict="the GitHub API could not be read"
              echo "attempt $attempt: $verdict; retrying in $(( 5 * (2 ** (attempt - 1)) ))s" >&2
              sleep "$(( 5 * (2 ** (attempt - 1)) ))"
              continue
            fi
            # A count that is not a decimal integer would be read by `$(( ))` as a
            # variable name — 0 when unset — which silently disables the completeness
            # cross-check while the log shows it applied. Validate rather than assume.
            if ! [[ "$before" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then
              verdict="the comment count was not a number (before='$before' after='$after')"
              echo "attempt $attempt: $verdict; retrying in $(( 5 * (2 ** (attempt - 1)) ))s" >&2
              sleep "$(( 5 * (2 ** (attempt - 1)) ))"
              continue
            fi
            set +e
            # --just-wrote: a dispatch happened moments ago, so a comment that is not yet
            # visible is a stale read rather than a missing write. Without it `absent` is
            # definitive and this loop cannot retry the very race it exists for.
            bun run check:ci-comment "$RUNNER_TEMP/after-first.json" \
              --expect-total="$(( before < after ? before : after ))" \
              --expect-ids="$(cat "$RUNNER_TEMP/prior-ids")" \
              --id-file="$RUNNER_TEMP/comment-id" \
              --just-wrote
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 2 ]; then
              echo "the comment set is wrong, and reading it again will not change that" >&2
              exit 1
            fi
            verdict="the comment list read is not yet consistent"
            echo "attempt $attempt: $verdict; retrying in $(( 5 * (2 ** (attempt - 1)) ))s" >&2
            sleep "$(( 5 * (2 ** (attempt - 1)) ))"
          done
          # Name what was actually observed. "never became visible, or was not unique"
          # is an OR across two causes with opposite responses, and it is the line
          # GitHub shows in the collapsed step summary.
          echo "gave up after 5 attempts: $verdict" >&2
          exit 1
      - name: Run the governing-decisions Action (second dispatch — must update in place)
        uses: ./packages/ci
        with:
          dir: docs/adr
      - name: Assert the second dispatch updated in place rather than creating
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Bracketed the same way as above. Exit 2 is retried here too: `incomplete`
          # is raised by a lagging replica as readily as by a lost --paginate, and this
          # assertion previously failed outright on it, which reds a required check on
          # a healthy Action with a message blaming pagination.
          # Same budget as the first assertion. It was 3 attempts with no stated reason
          # for the asymmetry, and with --just-wrote below it now guards the same race.
          verdict=""
          for attempt in 1 2 3 4 5; do
            # Soft reads, as in the first assertion. These were bare, so a single 502 or
            # secondary rate limit killed the step on attempt 1 — the transient class the
            # loop exists for — despite the comment claiming it was bracketed "the same
            # way as above".
            if ! before=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" --jq '.comments') \
               || ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                    > "$RUNNER_TEMP/after-second.json" \
               || ! after=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" --jq '.comments'); then
              verdict="the GitHub API could not be read"
              echo "attempt $attempt: $verdict; retrying in $(( 5 * (2 ** (attempt - 1)) ))s" >&2
              sleep "$(( 5 * (2 ** (attempt - 1)) ))"
              continue
            fi
            if ! [[ "$before" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then
              verdict="the comment count was not a number (before='$before' after='$after')"
              echo "attempt $attempt: $verdict; retrying in $(( 5 * (2 ** (attempt - 1)) ))s" >&2
              sleep "$(( 5 * (2 ** (attempt - 1)) ))"
              continue
            fi
            set +e
            bun run check:ci-comment "$RUNNER_TEMP/after-second.json" \
              --expect-total="$(( before < after ? before : after ))" \
              --expect-ids="$(cat "$RUNNER_TEMP/prior-ids")" \
              --expect-id="$(cat "$RUNNER_TEMP/comment-id")" \
              --just-wrote
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 2 ]; then
              echo "the comment set is wrong, and reading it again will not change that" >&2
              exit 1
            fi
            verdict="the comment list read is not yet consistent"
            echo "attempt $attempt: $verdict; retrying in $(( 5 * (2 ** (attempt - 1)) ))s" >&2
            sleep "$(( 5 * (2 ** (attempt - 1)) ))"
          done
          echo "gave up after 5 attempts: $verdict" >&2
          exit 1

  dco:
    # ADR-0006 chose a DCO over a CLA. CONTRIBUTING.md and the PR template have
    # required sign-off since the repository went public, and nothing checked it
    # — an unsigned commit would have merged. This is that check (issue #130).
    #
    # A repository script rather than the DCO GitHub App, so the gate stays
    # inside the surface ADR-0007 keeps mechanical and self-contained. It imports
    # only Node builtins and therefore runs with no `bun install`: a broken
    # dependency graph cannot take the sign-off gate down with it.
    #
    # **Advisory since ADR-0035.** This job runs from the pull request's own
    # checkout, so the pull request can edit both this step and the script it
    # calls (#137, measured on #98). It is kept because it is faster and reports
    # first, and because it can only ever fail *open* while the authoritative
    # `trusted-dco` job in `trusted-gates.yml` — executed from the default branch,
    # outside the pull request's control — also has to pass. Do not treat a green
    # result here as the sign-off gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify every commit carries a DCO sign-off
        env:
          # Explicit SHAs, not `origin/$BASE_REF..HEAD`. A ref resolves to
          # whatever it points at now, so a branch that moved mid-run silently
          # changes which commits were checked — the stale-read failure
          # ADR-0016 records under "report what was examined". The default
          # checkout is the synthetic merge ref, and this range excludes it.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run check:dco "$BASE_SHA..$HEAD_SHA"

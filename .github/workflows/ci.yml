name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-clone-builds:
    # T093 / FR-050 — a clean clone builds, typechecks, lints and tests green with both
    # feature-010 packages present, and **network access is permitted only during
    # `bun install --frozen-lockfile`**.
    #
    # The second half is enforced, not merely intended. Every step after the install runs
    # through `scripts/run-network-denied.ts`, which proves a qualifying denial mechanism
    # actually denies *in this environment* before it runs anything, and fails closed if
    # none can be proved. See `specs/009-catalog-binding-viability/contracts/
    # scale-and-security-measurement.md` §5, cited at its original location.
    #
    # A bare `unshare --net` prefix was rejected: if it silently stopped denying, this job
    # would keep passing and the guarantee would be gone with nothing to notice.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      # The ONLY step permitted to use the network.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Asserted before anything is built: a green build that silently skipped both new
      # packages would look identical to one that included them.
      - name: Verify both feature-010 packages are present in this clone
        run: bun scripts/check-clean-clone.ts
      - name: Typecheck (network denied)
        run: bun scripts/run-network-denied.ts -- bun run typecheck
      - name: Build (network denied)
        run: bun scripts/run-network-denied.ts -- bun run build
      - name: Verify publishable package tarballs (network denied)
        run: bun scripts/run-network-denied.ts -- bun run release:pack -- --skip-build --skip-smoke-install
      - name: Lint (network denied)
        run: bun scripts/run-network-denied.ts -- bun run lint
      - name: Test (network denied; includes resolution-is-pure)
        run: bun scripts/run-network-denied.ts -- bun test
      - name: Verify schema emit matches (network denied)
        run: bun scripts/run-network-denied.ts -- bun run schema:emit && git diff --exit-code schema/adr.schema.json
      - name: Verify committed Action bundle matches source
        run: git diff --exit-code packages/ci/dist
      - name: Verify dependency boundaries (adapters + toolkit confinement)
        run: bun scripts/run-network-denied.ts -- bun run check:deps
      - name: Verify frozen oracle hashes match (feature 010 Barrier B, R5 mechanism 2)
        run: bun scripts/run-network-denied.ts -- bun run check:freeze-hashes
      - name: Verify published docs pin the current CLI release (network denied)
        run: bun scripts/run-network-denied.ts -- bun run check:doc-pins
      - name: Verify the ADR-0020 clause-8 gate (clause 5 evidence is present and PASSing)
        run: bun scripts/run-network-denied.ts -- bun run check:clause8
      - name: Verify no spike-009 B/C/D comparison heuristic is present (FR-061)
        run: bun scripts/run-network-denied.ts -- bun run check:no-spike-heuristics
      - name: Lint ADR corpus (network denied)
        run: bun scripts/run-network-denied.ts -- bun run adr lint

  node-smoke-built-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Pack and install publishable packages
        run: bun run release:pack -- --skip-build
      - name: Smoke test built Node artifacts (core, evaluator, MCP on both protocol eras, CLI incl. offline adr evaluate + adr queue, Action bundle)
        run: node scripts/smoke-node.mjs
      - name: Smoke test committed queue Action bundle (corpus-load boundary, no network)
        run: node scripts/smoke-queue-node.mjs
      - name: Smoke test installed npm tarballs
        run: node .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

  audit:
    # Fail the build on high/critical advisories in this checkout's resolved
    # workspace dependency tree as installed by `bun install --frozen-lockfile`.
    # This does not audit consumer installs of published @adrkit/* manifests,
    # which resolve from the published manifests and inherit no root overrides or
    # workspace pins; the gate output records any known published-consumer
    # exposure separately (there is none as of ADR-0018).
    # Kept a separate job because it needs network for the advisory database, so
    # it never entangles the no-network clean-clone guarantee (ADR-0007).
    # ADR-0016: observed failing on the pre-fix tree; the permanent negative case
    # lives at scripts/__fixtures__/audit/prefix-high.json with unit coverage in
    # scripts/audit-gate.test.ts.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies (fail on high/critical advisories)
        run: bun run audit:gate

  self-dogfood:
    # Run the CI surface against the project that ships it: adr check on the PR's
    # changed files. Governs the corpus that defines the tool (rung-3 dogfood).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: adr check on the PR's changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          # Include deletions: a decision may govern a removed path, so deleted files
          # must stay in the changed set for path matchers to fire.
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          printf '  %s\n' "${changed[@]}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files to check."
            exit 0
          fi
          bun run adr check "${changed[@]}"

  dco:
    # ADR-0006 chose a DCO over a CLA. CONTRIBUTING.md and the PR template have
    # required sign-off since the repository went public, and nothing checked it
    # — an unsigned commit would have merged. This is that check (issue #130).
    #
    # A repository script rather than the DCO GitHub App, so the gate stays
    # inside the surface ADR-0007 keeps mechanical and self-contained. It imports
    # only Node builtins and therefore runs with no `bun install`: a broken
    # dependency graph cannot take the sign-off gate down with it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify every commit carries a DCO sign-off
        env:
          # Explicit SHAs, not `origin/$BASE_REF..HEAD`. A ref resolves to
          # whatever it points at now, so a branch that moved mid-run silently
          # changes which commits were checked — the stale-read failure
          # ADR-0016 records under "report what was examined". The default
          # checkout is the synthetic merge ref, and this range excludes it.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run check:dco "$BASE_SHA..$HEAD_SHA"

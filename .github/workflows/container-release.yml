name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing successful lockstep release tag containing the Containerfile.
        required: true
        type: string

concurrency:
  # Finalizing a public release moves the Action tag, so it shares the recovery
  # and npm-release serialization boundary.
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mbeacom/adrkit

jobs:
  validate-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the canonical repository and trusted dispatch ref
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mbeacom/adrkit"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi

  finalize:
    needs: validate-context
    if: >-
      github.repository == 'mbeacom/adrkit' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event.action == 'published' &&
          github.event.release.prerelease == false &&
          startsWith(github.event.release.tag_name, 'v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      revision: ${{ steps.source.outputs.revision }}
      created: ${{ steps.source.outputs.created }}
    steps:
      - name: Resolve the lockstep release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          UPSTREAM_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${MANUAL_TAG:-$UPSTREAM_TAG}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable lockstep tag v<semver>, got '$tag'." >&2
            exit 1
          fi
          version="${tag#v}"
          major="${version%%.*}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Require the completed lockstep release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .version package.json)" = "$RELEASE_VERSION"
          test -f Containerfile
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          revision=$(git rev-parse HEAD)
          release=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = false
          runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --branch "$RELEASE_TAG" \
            --event push \
            --limit 20 \
            --json conclusion,databaseId,headSha)
          successful_run=$(jq -r --arg revision "$revision" \
            '[.[] | select(.headSha == $revision and .conclusion == "success")][0].databaseId // empty' \
            <<<"$runs")
          test -n "$successful_run"
          {
            echo "revision=$revision"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse a withdrawn lockstep release
        env:
          RELEASE_SHA: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          marker="refs/tags/action-recovery-block/$RELEASE_SHA"
          if git ls-remote --exit-code --refs origin "$marker" >/dev/null; then
           marker_status=0
          else
           marker_status=$?
          fi
          case "$marker_status" in
           0)
             echo "Lockstep release commit $RELEASE_SHA was withdrawn from the moving Action tag." >&2
             exit 1
             ;;
           2) ;;
           *)
             echo "Unable to check withdrawal marker $marker (git ls-remote exit $marker_status)." >&2
             exit "$marker_status"
             ;;
          esac

      - name: Promote the moving major Action tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          cleanup() {
           git config --local --unset-all 'http.https://github.com/.extraheader' || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' "$header"
          bun run release:action-tag -- "$RELEASE_TAG" | tee action-tag-update.log
          {
           echo "### Moving major Action tag"
           echo
           echo '```text'
           cat action-tag-update.log
           echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.finalize.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the content-addressed multi-architecture image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          cache-from: type=gha,scope=adrkit-container
          cache-to: type=gha,mode=max,scope=adrkit-container
          context: .
          file: ./Containerfile
          labels: |
            org.opencontainers.image.created=${{ needs.finalize.outputs.created }}
            org.opencontainers.image.revision=${{ needs.finalize.outputs.revision }}
            org.opencontainers.image.version=${{ needs.finalize.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ env.IMAGE_NAME }}
          target: adrkit

      - name: Attest the content-addressed image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}

      - name: Promote the attested digest to public release tags
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ needs.finalize.outputs.major }}
          RELEASE_TAG: ${{ needs.finalize.outputs.tag }}
        run: |
          set -euo pipefail
          existing=""
          set +e
          manifest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:$RELEASE_TAG" \
            --format '{{json .Manifest}}' 2>&1)
          inspect_status=$?
          set -e
          if [ "$inspect_status" -eq 0 ]; then
            existing=$(jq -r '.digest // empty' <<<"$manifest")
            if [ -z "$existing" ]; then
              echo "Registry inspection succeeded but returned no digest for $RELEASE_TAG." >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|not found' <<<"$manifest"; then
            existing=""
          else
            printf '%s\n' "$manifest" >&2
            echo "Could not determine whether immutable tag $RELEASE_TAG exists." >&2
            exit "$inspect_status"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$DIGEST" ]; then
            echo "Immutable tag $RELEASE_TAG already resolves to $existing, refusing to move it to $DIGEST." >&2
            exit 1
          fi

          stable_tags=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name
                  | select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))')
          newest=$(sort -V <<<"$stable_tags" | tail -n 1)
          newest_major=$(grep -E "^v${MAJOR}\\." <<<"$stable_tags" | sort -V | tail -n 1)

          tags=(--tag "$IMAGE_NAME:$RELEASE_TAG")
          if [ "$RELEASE_TAG" = "$newest_major" ]; then
            tags+=(--tag "$IMAGE_NAME:v$MAJOR")
          fi
          if [ "$RELEASE_TAG" = "$newest" ]; then
            tags+=(--tag "$IMAGE_NAME:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE_NAME@$DIGEST"

name: Publish container

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing successful lockstep release tag containing the Containerfile.
        required: true
        type: string

concurrency:
  group: container-release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mbeacom/adrkit
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    if: >-
      github.repository == 'mbeacom/adrkit' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Resolve the lockstep release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          UPSTREAM_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          tag="${MANUAL_TAG:-$UPSTREAM_TAG}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable lockstep tag v<semver>, got '$tag'." >&2
            exit 1
          fi
          version="${tag#v}"
          major="${version%%.*}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}

      - name: Require the completed lockstep release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .version package.json)" = "$RELEASE_VERSION"
          test -f Containerfile
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          revision=$(git rev-parse HEAD)
          release=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = false
          runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --branch "$RELEASE_TAG" \
            --event push \
            --limit 20 \
            --json conclusion,databaseId,headSha)
          successful_run=$(jq -r --arg revision "$revision" \
            '[.[] | select(.headSha == $revision and .conclusion == "success")][0].databaseId // empty' \
            <<<"$runs")
          test -n "$successful_run"
          {
            echo "revision=$revision"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the content-addressed multi-architecture image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          cache-from: type=gha,scope=adrkit-container
          cache-to: type=gha,mode=max,scope=adrkit-container
          context: .
          file: ./Containerfile
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ env.PLATFORMS }}
          provenance: false
          tags: ${{ env.IMAGE_NAME }}
          target: adrkit

      - name: Verify the published architecture manifest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME@$DIGEST" \
            --format '{{json .Manifest}}')
          actual=$(jq -r \
            '[.manifests[].platform
              | select(.os != null and .architecture != null)
              | "\(.os)/\(.architecture)"]
             | unique | sort | join(",")' \
            <<<"$manifest")
          expected=$(tr ',' '\n' <<<"$PLATFORMS" | sort | paste -sd, -)
          if [ "$actual" != "$expected" ]; then
            echo "Expected container platforms '$expected', found '$actual'." >&2
            exit 1
          fi

      - name: Attest the content-addressed image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}

      - name: Promote the attested digest to public release tags
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          MAJOR: ${{ steps.release.outputs.major }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          existing=""
          set +e
          manifest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:$RELEASE_TAG" \
            --format '{{json .Manifest}}' 2>&1)
          inspect_status=$?
          set -e
          if [ "$inspect_status" -eq 0 ]; then
            existing=$(jq -r '.digest // empty' <<<"$manifest")
            if [ -z "$existing" ]; then
              echo "Registry inspection succeeded but returned no digest for $RELEASE_TAG." >&2
              exit 1
            fi
          elif grep -Eiq 'manifest unknown|not found' <<<"$manifest"; then
            existing=""
          else
            printf '%s\n' "$manifest" >&2
            echo "Could not determine whether immutable tag $RELEASE_TAG exists." >&2
            exit "$inspect_status"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$DIGEST" ]; then
            echo "Immutable tag $RELEASE_TAG already resolves to $existing, refusing to move it to $DIGEST." >&2
            exit 1
          fi

          stable_tags=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name
                  | select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))')
          newest=$(sort -V <<<"$stable_tags" | tail -n 1)
          newest_major=$(grep -E "^v${MAJOR}\\." <<<"$stable_tags" | sort -V | tail -n 1)

          tags=(--tag "$IMAGE_NAME:$RELEASE_TAG")
          if [ "$RELEASE_TAG" = "$newest_major" ]; then
            tags+=(--tag "$IMAGE_NAME:v$MAJOR")
          fi
          if [ "$RELEASE_TAG" = "$newest" ]; then
            tags+=(--tag "$IMAGE_NAME:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE_NAME@$DIGEST"

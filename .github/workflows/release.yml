name: Release

on:
  push:
    tags:
      # Lockstep release: core, evaluator, CLI, MCP.
      - 'v*.*.*'
      # Adapter release. Adapters are versioned independently (ADR-0007), so
      # they release independently too — shipping a fix for an upstream change
      # must not require republishing four unchanged packages under a new
      # version.
      - 'spec-kit-v*.*.*'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mbeacom/adrkit'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # gh release create (draft for lockstep, published for adapter)
      id-token: write # npm Trusted Publishing (OIDC provenance)
    steps:
      - name: Resolve release scope from the tag
        id: scope
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v*.*.*)
              echo "adapter=" >> "$GITHUB_OUTPUT"
              echo "lockstep=true" >> "$GITHUB_OUTPUT"
              ;;
            spec-kit-v*.*.*)
              echo "adapter=@adrkit/spec-kit" >> "$GITHUB_OUTPUT"
              echo "lockstep=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unrecognized release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Keep the contents:write token out of .git/config while dependencies
          # install and arbitrary build/test/publish code runs. The one step that
          # needs to push authenticates explicitly, for its own duration only.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Require the release commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "${{ steps.scope.outputs.lockstep }}" = "true" ]; then
            test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
            git cat-file -e "$GITHUB_SHA:action.yml"
          fi

      - name: Refuse a withdrawn lockstep release
        if: steps.scope.outputs.lockstep == 'true'
        run: |
          set -euo pipefail
          marker="refs/tags/action-recovery-block/$GITHUB_SHA"
          if git ls-remote --exit-code --refs origin "$marker" >/dev/null; then
            marker_status=0
          else
            marker_status=$?
          fi
          case "$marker_status" in
            0)
            echo "Lockstep release commit $GITHUB_SHA was withdrawn from the moving Action tag." >&2
            exit 1
              ;;
            2) ;;
            *)
              echo "Unable to check withdrawal marker $marker (git ls-remote exit $marker_status)." >&2
              exit "$marker_status"
              ;;
          esac

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Verify generated artifacts and dependency boundaries
        run: |
          bun run schema:emit
          git diff --exit-code schema/adr.schema.json packages/ci/dist
          bun run check:deps
          bun run adr lint

      - name: Pack release artifacts
        env:
          ADAPTER: ${{ steps.scope.outputs.adapter }}
        run: |
          set -euo pipefail
          if [ -n "$ADAPTER" ]; then
            bun run release:pack -- --tag "$GITHUB_REF_NAME" --skip-build --only "$ADAPTER"
          else
            bun run release:pack -- --tag "$GITHUB_REF_NAME" --skip-build
          fi

      - name: Set up Node 22 for installed-tarball smoke
        if: steps.scope.outputs.lockstep == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Smoke installed tarballs on Node 22
        if: steps.scope.outputs.lockstep == 'true'
        run: node .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

      - name: Set up Node 24 for smoke and npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Smoke installed tarballs on Node 24
        if: steps.scope.outputs.lockstep == 'true'
        run: node .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

      - name: Smoke installed tarballs on Bun
        if: steps.scope.outputs.lockstep == 'true'
        run: bun .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

      - name: Publish npm packages with provenance
        env:
          # Only consumed for a package in BOOTSTRAP_PACKAGES — npm Trusted
          # Publishing cannot be configured for a name that does not exist yet,
          # so a first publish needs a credential. release-publish.ts scrubs it
          # from the environment of every other package, and the secret should be
          # deleted once the name is established (ADR-0019 action item 6).
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: bun run release:publish

      - name: Build the catalog release asset
        # The Spec Kit community catalog installs an extension from a .zip
        # attached to its GitHub release, so an adapter release must carry one.
        if: steps.scope.outputs.lockstep != 'true'
        run: bun scripts/pack-extension-zip.ts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ steps.scope.outputs.adapter }}
          LOCKSTEP: ${{ steps.scope.outputs.lockstep }}
        run: |
          set -euo pipefail
          assets=()
          if [ -n "$ADAPTER" ]; then
            # Exactly one asset, produced by the step above.
            while IFS= read -r zip; do assets+=("$zip"); done < <(find .release -maxdepth 1 -name '*.zip')
            if [ "${#assets[@]}" -ne 1 ]; then
              echo "Expected exactly one catalog asset, found ${#assets[@]}" >&2
              exit 1
            fi
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            fi
          else
            if [ "$LOCKSTEP" = "true" ]; then
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
            fi
          fi

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mbeacom/adrkit'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # gh release create + force-push the major Action tag
      id-token: write # npm Trusted Publishing (OIDC provenance)
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Keep the contents:write token out of .git/config while dependencies
          # install and arbitrary build/test/publish code runs. The one step that
          # needs to push authenticates explicitly, for its own duration only.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Verify generated artifacts and dependency boundaries
        run: |
          bun run schema:emit
          git diff --exit-code schema/adr.schema.json packages/ci/dist
          bun run check:deps
          bun run adr lint

      - name: Pack release artifacts
        run: bun run release:pack -- --tag "$GITHUB_REF_NAME" --skip-build

      - name: Set up Node 22 for installed-tarball smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Smoke installed tarballs on Node 22
        run: node .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

      - name: Set up Node 24 for smoke and npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Smoke installed tarballs on Node 24
        run: node .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

      - name: Smoke installed tarballs on Bun
        run: bun .release/smoke/smoke.mjs "$GITHUB_WORKSPACE"

      - name: Publish npm packages with provenance
        run: bun run release:publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

      - name: Update the major Action tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout does not persist credentials, so this is the only point
          # in the job where a push-capable credential exists in Git config. It is
          # removed on exit, including when the push fails.
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          cleanup() {
            git config --local --unset-all 'http.https://github.com/.extraheader' || true
          }
          trap cleanup EXIT
          git config --local 'http.https://github.com/.extraheader' "$header"
          bun run release:action-tag -- "$GITHUB_REF_NAME"

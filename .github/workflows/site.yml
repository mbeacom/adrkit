name: Deploy site

# Builds the Astro/Starlight docs site with Bun. On pull requests it runs a
# build-only check (the site is excluded from every root gate, so this is the
# only thing that catches a broken site change before merge). On push to main it
# also deploys to GitHub Pages at the custom apex domain adrkit.dev.
#
# Kept separate from ci.yml on purpose: the project's build/test/lint gates and
# the site deploy are independent concerns and should not block or entangle each
# other.

on:
  # No `paths` filter on push. The site now serves `queue.json` and `lint.json`,
  # which are projections of `main` produced by the CLI — so the deploy must
  # re-run when the *projector* changes, not only when the corpus does.
  # Enumerating the generator's dependencies (`packages/core/src/queue/**`,
  # `load/**`, `validate/**`, the CLI entrypoint…) is fragile: one missed path
  # leaves adrkit.dev serving numbers from an older implementation, silently.
  # Deploying on every push to main is the only filter that cannot miss one.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'schema/adr.schema.json'
      # Retained prior versions, served at their own `$id` (ADR-0011 item 6).
      - 'schema/versions/**'
      - 'docs/adr/**'
      - '.github/workflows/site.yml'
      # The docs pin the released CLI version; a release bump must re-run that
      # guard in the same push rather than failing the next unrelated change.
      - 'package.json'
      # The decision portal at /decisions/ is built by the committed Action
      # bundle and checked by this script; a change to either must re-run it.
      - 'packages/ci/portal/**'
      - 'packages/ci/dist/portal-action.js'
      - 'scripts/check-portal-bundle.ts'
  workflow_dispatch:

# Least-privilege baseline. Pages deploy privileges are scoped to the deploy job.
permissions:
  contents: read

# Serialize per ref; never cancel an in-flight deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Read by the deploy job, which turns the run red after deploying when a
    # step that is non-blocking on `main` failed (see the portal and rendered
    # steps below). On pull requests those steps fail this job directly.
    outputs:
      portal_failed: >-
        ${{ steps.portal_route.outcome == 'failure' ||
            steps.portal.outcome == 'failure' ||
            steps.portal_check.outcome == 'failure' }}
      rendered_failed: >-
        ${{ steps.rendered.outcome == 'failure' ||
            steps.rendered_self_test.outcome == 'failure' }}
    # This job now drives a browser, which is the first step here that can hang
    # rather than error. The concurrency group never cancels, so an unbounded
    # hang would freeze every later deploy invisibly.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2

      # `astro build` runs under Node, not Bun, and Astro 7.4 requires
      # >=22.23.4. Pin it rather than inherit the runner image's Node, whose
      # 22.23.3 failed the build. 24 matches the portal Action's runtime.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Serve canonical schema at its $id
        run: bun run sync:schema

      - name: Guard — served schema byte-identical to canonical + no stale doc versions
        run: bun run check:schema

      # The ARB queue badge on the README reads this file over HTTP. It is
      # derived from the corpus at build time and never committed, so it cannot
      # go stale between corpus changes — the same discipline as the served
      # schema above (ADR-0025). `site` is deliberately not a workspace member,
      # so the projection runs from the repo root rather than making the site
      # depend on `@adrkit/core`.
      #
      # `adr lint --json` and `adr queue --format json` both document exit 1 as
      # "report emitted, with error-severity findings" — the report is complete
      # and publishable. A corpus problem, and equally a tool regression
      # (exit >= 2), must not stop this job from deploying the canonical schema
      # at its `$id` (ADR-0011). A badge degrades to a missing file; the schema
      # always ships. Both artifacts are the commands' verbatim output — no
      # bespoke badge format (ADR-0025).
      - name: Emit the corpus reports for the badges
        working-directory: .
        run: |
          bun install --frozen-lockfile
          # `key` is the field the badge actually reads. Validating only that the
          # file parses would let a structurally valid but wrong report through,
          # and the badge would render `no result` as if adrkit were broken.
          # `type(x) is int` rather than `isinstance`: bool subclasses int, so
          # isinstance would accept `{"totalItems": true}`.
          publish () {
            name="$1"; key="$2"; shift 2
            set +e
            "$@" > "/tmp/${name}.json"
            status=$?
            set -e
            if [ "$status" -ge 2 ]; then
              echo "::warning::${name}: exited ${status}; publishing the site without ${name}.json"
              return 0
            fi
            if [ "$status" -eq 1 ]; then
              echo "::warning::${name}: corpus has error-severity findings; the report is complete and is being published"
            fi
            if ! python3 -c "import json,sys; d=json.load(open('/tmp/${name}.json')); sys.exit(0 if type(d.get('${key}')) is int else 1)" 2>/dev/null; then
              echo "::warning::${name}: report is unreadable or has no integer ${key}; publishing the site without ${name}.json"
              return 0
            fi
            cp "/tmp/${name}.json" "site/public/${name}.json"
          }
          publish queue totalItems bun packages/cli/src/index.ts queue --format json
          publish lint  checked    bun packages/cli/src/index.ts lint --json

      - name: Build site
        run: bun run build

      # This repository's own decision portal, served at adrkit.dev/decisions/
      # as ADR-0054's rung-2 dogfood (its action item 8). It is built by the
      # nested Action from this checkout, so it runs the committed
      # `packages/ci/dist/portal-action.js` exactly as a consumer pinning a
      # release does. `uses:` ignores the job's `working-directory`; the Action
      # resolves `dir` and `out` against the workspace.
      #
      # It writes into `site/dist` after `astro build`, not into `site/public`
      # before it. Astro empties `dist` when it builds, so nothing stale
      # survives; the portal is a directory the Action replaces whole and no
      # site page reads, unlike the badge files, which `astro dev` must serve;
      # and Astro has finished, so the guard below can prove no Starlight route
      # already owns `/decisions/` before the Action replaces it. No `base-url`:
      # the page needs none, and building without one is what shows the bundle
      # works at a subpath unchanged (ADR-0054 clause 8).
      #
      # The visibility gate passes on `push` and `workflow_dispatch` because
      # this repository is public and both payloads carry `repository` with
      # `private: false`. Never set `publish-private` here.
      #
      # Exit 1 (corpus errors) succeeds with a warning and publishes, as the
      # badge step does (clause 9). A refusal or exit 2 writes nothing and fails
      # the step; on `main` that is non-blocking for the reason stated above the
      # rendered checks: a missing portal must not withhold the canonical schema
      # at its `$id` (ADR-0011). The site then deploys without `/decisions/`
      # (or with an unchecked one), and the deploy job turns the run red after
      # deploying.
      - name: Guard — no site route owns /decisions/
        id: portal_route
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -e dist/decisions ]; then
            echo "::error::site/dist/decisions exists after astro build; a site page claims /decisions/, which the portal would replace"
            exit 1
          fi

      - name: Build the decision portal
        id: portal
        if: steps.portal_route.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        uses: ./packages/ci/portal
        with:
          dir: docs/adr
          out: site/dist/decisions

      # The Action exiting 0 says it wrote something. This checks what: the page
      # files, `portal-data.json` at `version: "1"`, as many records as
      # `adr lint` checked in the badge step above, and no asset reference that
      # would break at a subpath. Its unit test sabotages each assertion.
      - name: Check the decision portal bundle
        id: portal_check
        if: steps.portal.outcome == 'success'
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        working-directory: .
        run: bun run scripts/check-portal-bundle.ts --bundle site/dist/decisions --lint site/public/lint.json

      # `astro build` exiting 0 says the pages compile; it says nothing about how
      # they render. Every defect fixed in #150 — a rule that silently lost a
      # specificity contest, a badge at 1.1:1, a page title ~180px out of line —
      # compiled perfectly and would have deployed. This loads the built output
      # in the runner's preinstalled Chrome and asserts specific computed styles
      # and geometry instead.
      #
      # The self-test runs first and on its own: it sabotages each invariant and
      # fails unless the checks catch it, so a checker that has quietly stopped
      # looking cannot report a green "0 failures" (CONTRIBUTING, third hard
      # rule). No browser is downloaded — `playwright-core` ships no binaries and
      # this drives the Chrome already on the image, so the frozen install stays
      # the only step that touches the network.
      # Blocking on pull requests, where nothing deploys and the author is
      # present — that is where a rendered regression should be stopped.
      #
      # Non-blocking on push, deliberately, for the reason stated above the badge
      # step: a presentational assertion must not stop this job from deploying
      # the canonical schema at its `$id` (ADR-0011). Withholding the artifact
      # would leave adrkit.dev serving the *previous* schema bytes to every
      # `$ref` consumer because a colour moved. The run still goes red and
      # annotates, from the deploy job after `deploy-pages`, so the signal
      # survives; only the veto over the schema is removed. A failing step in
      # this job would fail the job, skip the upload, and through
      # `needs: build` skip the deploy, which is exactly the veto.
      - name: Guard — the rendered checks can still fail
        id: rendered_self_test
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: bun run check:rendered:self-test

      - name: Check rendered output
        id: rendered
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: bun run check:rendered

      # Only publish an artifact for real deployments (push to main / manual run).
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          # Path is relative to the repository root, not the job working dir.
          path: site/dist

  deploy:
    needs: build
    # Deploy only on push to main or a manual dispatch — never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages deploy privileges live here, not workflow-wide: the build job never
    # receives pages:write or id-token:write.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      # After the deploy, not in the build job: a failing step there fails the
      # job, and `needs: build` would then withhold the deploy, schema included.
      # The second step uses `always()` (still only after a successful
      # deploy) so that a rendered failure, which fails this job first, does
      # not hide a portal failure.
      - name: Annotate a rendered failure that did not block the deploy
        if: needs.build.outputs.rendered_failed == 'true'
        run: |
          echo "::error title=Rendered check failed on main::The site deployed anyway so the canonical schema at its \$id stays current (ADR-0011). Fix the rendered regression, or revert — see site/DEPLOYMENT.md."
          exit 1

      - name: Annotate a portal failure that did not block the deploy
        if: always() && needs.build.outputs.portal_failed == 'true' && steps.deployment.outcome == 'success'
        run: |
          echo "::error title=Decision portal failed on main::The site deployed anyway so the canonical schema at its \$id stays current (ADR-0011); /decisions/ is missing or unchecked. Fix it, or revert — see site/DEPLOYMENT.md."
          exit 1

name: Deploy site

# Builds the Astro/Starlight docs site with Bun. On pull requests it runs a
# build-only check (the site is excluded from every root gate, so this is the
# only thing that catches a broken site change before merge). On push to main it
# also deploys to GitHub Pages at the custom apex domain adrkit.dev.
#
# Kept separate from ci.yml on purpose: the project's build/test/lint gates and
# the site deploy are independent concerns and should not block or entangle each
# other.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schema/adr.schema.json'
      - 'docs/adr/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'schema/adr.schema.json'
      - 'docs/adr/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Least-privilege baseline. Pages deploy privileges are scoped to the deploy job.
permissions:
  contents: read

# Serialize per ref; never cancel an in-flight deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Serve canonical schema at its $id
        run: bun run sync:schema

      - name: Guard — served schema byte-identical to canonical + no stale doc versions
        run: bun run check:schema

      - name: Build site
        run: bun run build

      # Only publish an artifact for real deployments (push to main / manual run).
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          # Path is relative to the repository root, not the job working dir.
          path: site/dist

  deploy:
    needs: build
    # Deploy only on push to main or a manual dispatch — never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages deploy privileges live here, not workflow-wide: the build job never
    # receives pages:write or id-token:write.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

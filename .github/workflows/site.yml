name: Deploy site

# Builds the Astro/Starlight docs site with Bun. On pull requests it runs a
# build-only check (the site is excluded from every root gate, so this is the
# only thing that catches a broken site change before merge). On push to main it
# also deploys to GitHub Pages at the custom apex domain adrkit.dev.
#
# Kept separate from ci.yml on purpose: the project's build/test/lint gates and
# the site deploy are independent concerns and should not block or entangle each
# other.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schema/adr.schema.json'
      - 'docs/adr/**'
      - '.github/workflows/site.yml'
      # The docs pin the released CLI version; a release bump must re-run that
      # guard in the same push rather than failing the next unrelated change.
      - 'package.json'
  pull_request:
    paths:
      - 'site/**'
      - 'schema/adr.schema.json'
      - 'docs/adr/**'
      - '.github/workflows/site.yml'
      # The docs pin the released CLI version; a release bump must re-run that
      # guard in the same push rather than failing the next unrelated change.
      - 'package.json'
  workflow_dispatch:

# Least-privilege baseline. Pages deploy privileges are scoped to the deploy job.
permissions:
  contents: read

# Serialize per ref; never cancel an in-flight deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Serve canonical schema at its $id
        run: bun run sync:schema

      - name: Guard — served schema byte-identical to canonical + no stale doc versions
        run: bun run check:schema

      # The ARB queue badge on the README reads this file over HTTP. It is
      # derived from the corpus at build time and never committed, so it cannot
      # go stale between corpus changes — the same discipline as the served
      # schema above (ADR-0025). `site` is deliberately not a workspace member,
      # so the projection runs from the repo root rather than making the site
      # depend on `@adrkit/core`.
      #
      # `adr queue` documents exit 1 as "report emitted with error-severity
      # corpus findings" — the report is complete and publishable, so a corpus
      # problem must not stop this job from deploying the canonical schema at
      # its `$id` (ADR-0011). Only exit 2 (usage error / unreachable corpus)
      # means no report was produced.
      - name: Emit the ARB queue report for the badge
        working-directory: .
        run: |
          bun install --frozen-lockfile
          set +e
          bun run site:queue
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            echo "::error::adr queue exited ${status}; no usable report was produced"
            exit "$status"
          fi
          if [ "$status" -eq 1 ]; then
            echo "::warning::Corpus has error-severity findings; the queue report is still complete and is being published"
          fi
          python3 -c "import json,sys; d=json.load(open('site/public/queue.json')); sys.exit(0 if type(d.get('totalItems')) is int else 'queue.json has no integer totalItems')"

      - name: Build site
        run: bun run build

      # Only publish an artifact for real deployments (push to main / manual run).
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          # Path is relative to the repository root, not the job working dir.
          path: site/dist

  deploy:
    needs: build
    # Deploy only on push to main or a manual dispatch — never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages deploy privileges live here, not workflow-wide: the build job never
    # receives pages:write or id-token:write.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Decision portal</title>
<link rel="icon" href="./page/icon.svg" type="image/svg+xml">

<script type="module" src="./page/app.mjs"></script>

<body>
<div class="wrap">

    <span id="corpus" class="muted small mono"></span>

  <nav aria-label="Portal views">
    <ul class="nav plain">
      <li><a id="nav-overview" href="#/">Records</a></li>
